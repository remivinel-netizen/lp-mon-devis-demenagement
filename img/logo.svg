<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 44" role="img" aria-label="Mon Devis Déménagement">
  <!-- Marque : un camion de déménagement vu de profil. Caisse et cabine en
       magenta, bande d'adhésif blanche, roues en encre. Dessiné pour rester
       lisible à petite taille : aucun détail sous 2 px, et la silhouette
       seule suffit à l'identifier. -->
  <g>
    <rect x="2" y="12" width="23" height="19" rx="2" fill="#CE0054"/>
    <rect x="2" y="17.9" width="23" height="3.6" fill="#fff" opacity=".92"/>
    <path d="M25 18.4h7.7l5.9 6V31H25z" fill="#CE0054"/>
    <path d="M27.1 20.5h4.9l3.4 3.5h-8.3z" fill="#fff" opacity=".9"/>
    <circle cx="10.6" cy="33.4" r="3.6" fill="#222E3A"/>
    <circle cx="31.6" cy="33.4" r="3.6" fill="#222E3A"/>
  </g>
  <text x="48" y="20" font-family="'Roboto Slab',Georgia,serif"
        font-size="15" font-weight="700" fill="#222E3A">Mon Devis</text>
  <text x="48" y="35.6" font-family="'Roboto',system-ui,sans-serif"
        font-size="13.5" font-weight="400" fill="#4A5260">Déménagement</text>
</svg>
