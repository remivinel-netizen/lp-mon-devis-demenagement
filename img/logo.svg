    <rect x="1.6" y="4.6" width="34.8" height="34.8" rx="10" fill="#222E3A"/>
    <rect x="16.2" y="4.6" width="5.6" height="34.8" fill="#8DC63F" opacity=".85"/>
    <path d="M11 26.5 19 18.5 27 26.5" fill="none" stroke="#fff" stroke-width="3.1"
