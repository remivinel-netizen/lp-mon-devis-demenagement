<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 44" role="img" aria-label="Mon Devis Déménagement">
  <!-- Symbole : camion plein, flèche de progression en réserve dans la caisse,
       trois lignes de vitesse. Concept exploré en génération d'image puis
       redessiné sur grille : épaisseurs constantes (2,6), pointe de flèche
       d'équerre, roues strictement identiques.
       L'artwork est commun aux deux variantes — seul le wordmark change. -->
  <g fill="none" stroke="#CE0054" stroke-width="2.6" stroke-linecap="round">
    <path d="M1.6 15.2h9.2M1.6 20.6h9.2M1.6 26h9.2"/>
  </g>
  <g fill="#CE0054">
    <rect x="14" y="9.4" width="20.6" height="20.6" rx="2.4"/>
    <path d="M34.6 16.4h6.4l5.2 5.7V30h-11.6z"/>
  </g>
  <g fill="#fff">
    <path d="M36.7 18.6h3.5l2.9 3.2h-6.4z"/>
    <path d="m18.4 27.6 8.9-8.9-2.6-2.6h8.1v8.1l-2.6-2.6-8.9 8.9z"/>
  </g>
  <g>
    <circle cx="20.6" cy="32.6" r="4.1" fill="#CE0054"/>
    <circle cx="38.2" cy="32.6" r="4.1" fill="#CE0054"/>
    <circle cx="20.6" cy="32.6" r="1.6" fill="#fff"/>
    <circle cx="38.2" cy="32.6" r="1.6" fill="#fff"/>
  </g>
  <text x="56" y="20" font-family="'Roboto Slab',Georgia,serif"
        font-size="15" font-weight="700" fill="#222E3A">Mon Devis</text>
  <text x="56" y="35.6" font-family="'Roboto',system-ui,sans-serif"
        font-size="13.5" font-weight="400" fill="#4A5260">Déménagement</text>
</svg>
